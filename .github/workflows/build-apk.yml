name: Build Flexo AI APK # Local-only build with no network permission

on:
  push:
    branches: [main, feature/built-in-intelligence-ui]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: flexo-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python for transparent logo assets
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon processing dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate transparent official logo assets
        run: python android/tools/generate_icons.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlexoAI-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
