name: Lex backend validation

on:
  push:
    branches: [feature/lex-pika-h3-flex]
    paths:
      - 'lex-backend/**'
      - '.github/workflows/lex-backend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r lex-backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q lex-backend
      - name: Import FastAPI application
        working-directory: lex-backend
        env:
          LEX_DATA_DIR: ${{ runner.temp }}/lex-data
        run: python -c "import main; assert main.app.title == 'Lex Video Inference API'"
