name: Validate Flexo Web App

on:
  push:
    branches: [main, web-platform-foundation]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate web app and inline scripts
        run: node scripts/validate-web.mjs
