plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.flexo.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flexo.ai'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

// Native PDF text extraction for Knowledge imports.
dependencies {
    implementation "com.tom-roush:pdfbox-android:2.0.27.0"
}
