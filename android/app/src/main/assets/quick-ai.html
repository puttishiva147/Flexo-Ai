<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Flexo Quick AI</title>
<style>
:root{color-scheme:dark;--bg:#0B0B0C;--s:#141416;--s2:#1C1C1F;--b:#26262A;--t:#F2EFEA;--m:#A8A39B;--d:#8A857D;--c:#D9BFA3;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:system-ui,-apple-system,sans-serif;color:var(--t)}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 70% at 20% 10%,#2a2622 0,transparent 60%),radial-gradient(100% 60% at 90% 80%,#1d2128 0,transparent 60%),var(--bg)}
#dim{position:absolute;inset:0;background:rgba(11,11,12,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .5s ease}
.open #dim{opacity:1;pointer-events:auto}
#cam{position:absolute;top:max(14px,env(safe-area-inset-top));left:calc(50% - 8px);width:16px;height:16px;border-radius:8px;background:#000}
#lg{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 30px);left:calc(50% - 20px);width:40px;padding:0;border:0;background:none;cursor:pointer;transform-origin:0 0;transition:transform .7s cubic-bezier(.22,1,.36,1);animation:fade .8s ease both;z-index:3}
.open #lg{transform:var(--t);pointer-events:none}
#lg img{width:100%;height:auto;display:block}
.orb{display:block;animation:br 4s ease-in-out infinite}
@keyframes br{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.5px) scale(1.05)}}
@keyframes fade{from{opacity:0}}
#pn{position:absolute;top:calc(max(14px,env(safe-area-inset-top)) + 70px);left:0;right:0;margin:0 auto;width:min(358px,calc(100% - 32px));background:var(--bg);border:1px solid var(--b);border-radius:28px;padding:14px;box-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0;transform:scale(.06);pointer-events:none;transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .35s ease;z-index:2}
.open #pn{opacity:1;transform:none;pointer-events:auto}
#in{opacity:0;transition:opacity .3s ease}.open #in{opacity:1;transition:opacity .45s ease .3s}
.hd{display:flex;align-items:center;height:34px;gap:10px}.hd .sp{width:44px;flex:none}.hd .ti{flex:1;font-size:13px;color:var(--m)}
.ib{width:40px;height:40px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--m);font-size:22px;border-radius:20px}
.ib:active{background:var(--s)}
#th{max-height:min(44vh,340px);overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.m{font-size:15px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.u{align-self:flex-end;max-width:82%;background:var(--s2);border:1px solid var(--b);border-radius:18px 18px 6px 18px;padding:10px 14px;font-size:14px}
.wait{color:var(--d)}
.ch{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ch button{height:44px;padding:0 14px;border:1px solid var(--b);border-radius:22px;background:var(--s);color:var(--c);font-size:13px;cursor:pointer;transition:background .2s}
.ch button:active{background:var(--s2)}
#cx{display:none;margin-top:12px;background:var(--s);border:1px solid var(--b);border-radius:18px;padding:14px}
#cx.on{display:block}
#cx h3{margin:0;font-size:15px}#cx p{margin:6px 0 0;font-size:13px;line-height:1.5;color:var(--m)}
.pb{width:100%;height:44px;margin-top:12px;border:0;border-radius:22px;background:var(--t);color:var(--bg);font-size:14px;font-weight:600;cursor:pointer}
.row{display:flex;gap:8px;margin-top:8px}.row button{flex:1;height:44px;border:1px solid var(--b);border-radius:22px;background:none;color:var(--t);font-size:13px;cursor:pointer}
#pt{display:none;margin-top:8px}#pt.on{display:block}
#pt textarea{width:100%;height:90px;resize:none;background:var(--bg);border:1px solid var(--b);border-radius:14px;color:var(--t);font:inherit;font-size:14px;padding:10px;outline:0}
#pill{display:none;margin-top:12px;align-items:center;gap:6px;font-size:12px;color:var(--d)}#pill.on{display:flex}
#pill button{border:0;background:none;color:var(--m);font-size:16px;cursor:pointer;padding:6px}
.bar{display:flex;align-items:center;gap:8px;margin-top:12px;background:var(--s);border:1px solid var(--b);border-radius:26px;padding:4px 4px 4px 16px}
.fw{flex:1;min-width:0;position:relative;height:44px}
#q{width:100%;height:44px;border:0;outline:0;background:none;color:var(--t);font-size:16px}
#ph{position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;gap:6px;pointer-events:none;color:var(--d);font-size:15px;transition:opacity .2s}
#ph img{height:14px;width:auto}
.fw:focus-within #ph,.fw.has #ph{opacity:0}
#sd{width:44px;height:44px;border:0;border-radius:50%;background:var(--t);color:var(--bg);font-size:18px;cursor:pointer;flex:none}
#sd:disabled{opacity:.5}
#toast{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom));margin:0 auto;max-width:358px;background:var(--s2);border:1px solid var(--b);border-radius:16px;padding:12px 14px;font-size:13px;line-height:1.4;opacity:0;transform:translateY(8px);transition:.3s;pointer-events:none;z-index:5}
#toast.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<script>
const $=s=>document.querySelector(s);
const root=$('#app'),lg=$('#lg'),pn=$('#pn'),th=$('#th'),q=$('#q'),fw=$('#fw'),tt=$('#toast');
const SYS='You are Flexo Quick AI, a fast assistant in a small floating panel on a phone. Answer concisely and clearly. Only claim to see screen content or images when the user explicitly shares them.';
const INS={Explain:'Explain this clearly and briefly.',Summarize:'Summarize this in a few short points.',Translate:'Translate this to English (if it is already English, translate it to Hindi).'};
let isOpen=false,hist=[],ctx=null,busy=false,pend=null,tm;
const API_ENDPOINT = (window.FLEXO_API_ENDPOINT || localStorage.getItem('flexo_api_endpoint') || (location.protocol!=='file:' ? location.origin+'/api/quick-ai' : '')).trim();
function toast(t){tt.textContent=t;tt.classList.add('on');clearTimeout(tm);tm=setTimeout(()=>tt.classList.remove('on'),3600)}
function place(){const px=pn.offsetLeft,py=pn.offsetTop;lg.style.setProperty('--t','translate('+(px+14-lg.offsetLeft)+'px,'+(py+17-lg.offsetTop)+'px) scale(1.1)');pn.style.transformOrigin=(lg.offsetLeft+20-px)+'px '+(lg.offsetTop+13-py)+'px'}
function setOpen(v){isOpen=v;place();root.classList.toggle('open',v);if(v)setTimeout(()=>q.focus({preventScroll:true}),500);else q.blur()}
lg.onclick=()=>setOpen(true);$('#cl').onclick=()=>setOpen(false);$('#dim').onclick=()=>setOpen(false);
addEventListener('resize',()=>{if(isOpen)place()});
$('#op').onclick=()=>toast('Quick AI is running inside Flexo. Use the message box to ask a question.');
function add(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;th.appendChild(d);th.scrollTop=th.scrollHeight;return d}
function pill(){const p=$('#pill');if(ctx){$('#pl').textContent=ctx.img?'Screenshot attached':'Using text you shared';p.classList.add('on')}else p.classList.remove('on')}
async function ask(text,shown){
 if(busy||!text.trim())return;
 if(!API_ENDPOINT){toast('AI backend is not configured yet. The app needs its hosted API endpoint.');return}
 busy=true;$('#sd').disabled=true;add('u',shown||text);const a=add('a','Thinking…');a.classList.add('wait');
 const userMessage={role:'user',content:text};hist.push(userMessage);
 try{
  const payload={system:SYS,messages:hist,context_text:ctx&&ctx.text?ctx.text:'',image_data_url:ctx&&ctx.img?await fileToDataUrl(ctx.img):null};
  const response=await fetch(API_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||('Request failed ('+response.status+')'));
  if(!data.text)throw new Error('AI backend returned an empty response.');
  a.classList.remove('wait');a.textContent=data.text;hist.push({role:'assistant',content:data.text});
 }catch(e){a.classList.remove('wait');a.textContent='Could not get an AI response. '+(e&&e.message?e.message:'Check your connection and try again.');hist.pop();toast('AI request failed. Check backend setup and internet.')}
 finally{busy=false;$('#sd').disabled=false}
}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result));reader.onerror=()=>reject(new Error('Could not read attached image.'));reader.readAsDataURL(file)})}
function send(){const v=q.value.trim();if(!v)return;q.value='';fw.classList.remove('has');ask(ctx&&ctx.text?v+'\n\nContext the user shared:\n'+ctx.text:v,v)}
$('#sd').onclick=send;q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};q.oninput=()=>fw.classList.toggle('has',!!q.value);
document.querySelectorAll('.ch button').forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(!ctx){pend=a;$('#cx').classList.add('on');return}ask(INS[a]+(ctx.text?'\n\nText:\n'+ctx.text:'\n\nUse the attached screenshot as context.'),a)});
function got(){$('#cx').classList.remove('on');$('#pt').classList.remove('on');pill();if(pend){const a=pend;pend=null;ask(INS[a]+(ctx.text?'\n\nText:\n'+ctx.text:'\n\nUse the attached screenshot as context.'),a)}}
$('#sa').onclick=()=>toast('Screen reading needs Android accessibility permission. It is not available in this prototype yet.');
$('#pa').onclick=()=>{$('#pt').classList.toggle('on');$('#ta').focus()};
$('#ut').onclick=()=>{const t=$('#ta').value.trim();if(!t)return;ctx={text:t};$('#ta').value='';got()};
$('#sh').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(!f.type.startsWith('image/')){toast('Choose an image file.');return}if(f.size>8*1024*1024){toast('Image is too large. Choose one under 8 MB.');return}ctx={img:f};got()};
$('#px').onclick=()=>{ctx=null;pill()};
</script></body></html>
